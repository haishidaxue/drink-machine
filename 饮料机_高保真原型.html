<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>饮料机 · 高保真小程序原型</title>
<style>
  :root{
    --paper:#f5f2ea; --ivory:#fbf9f4;
    --ink:#282a26; --ink2:#60635a; --ink3:#9fa197;
    --pine:#43584a; --pine2:#5f7a66; --pineSoft:#e7ece4;
    --gold:#b89b64; --goldSoft:#e7ddc7; --line:#e4e0d4;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(820px 620px at 8% -12%,#e8e5db 0,transparent 60%),
      radial-gradient(820px 720px at 112% 112%,#d9d6cb 0,transparent 60%),
      #d8d5ca;
    color:var(--ink);display:flex;align-items:center;justify-content:center;
    gap:56px;padding:28px;min-height:100vh;
  }

  .brief{max-width:246px;align-self:center}
  .brief h2{font-size:28px;margin:0 0 10px;color:var(--pine);font-weight:700;letter-spacing:3px;
    font-family:"Songti SC",serif}
  .brief p{font-size:13px;line-height:2;color:#686a62;margin:0 0 14px}
  .brief .tag{display:inline-block;border:1px solid #c4c2b8;background:rgba(255,255,255,.6);
    color:var(--pine);border-radius:99px;padding:4px 13px;font-size:11.5px;margin:0 6px 8px 0}
  @media(max-width:860px){.brief{display:none}}

  /* 手机外壳 */
  .phone{width:390px;height:820px;flex:0 0 auto;border-radius:56px;padding:11px;
    background:linear-gradient(150deg,#4b4e48,#2a2d29);
    box-shadow:0 48px 96px -34px rgba(40,46,40,.55),inset 0 0 0 2px rgba(255,255,255,.14)}
  .screen{position:relative;width:100%;height:100%;border-radius:44px;overflow:hidden;background:var(--paper)}
  .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:138px;height:24px;
    background:#d9d6cc;border-radius:0 0 14px 14px;z-index:60}

  .statusbar{height:44px;display:flex;align-items:center;justify-content:space-between;
    padding:0 28px;font-size:13.5px;font-weight:600;color:var(--ink);position:relative;z-index:5}
  .navbar{height:50px;display:flex;align-items:center;justify-content:center;position:relative;z-index:40;
    font-size:16.5px;font-weight:700;letter-spacing:3px;color:var(--ink)}
  .navbar .back{position:absolute;left:12px;width:38px;height:38px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);font-size:27px;
    transition:background .2s}
  .navbar .back:hover{background:rgba(60,70,60,.1)}
  .navbar .navrec{position:absolute;right:12px;top:50%;transform:translateY(-50%);
    display:flex;align-items:center;gap:4px;height:32px;padding:0 12px;border-radius:99px;
    border:1px solid var(--line);background:#fbfaf6;color:var(--ink);font-size:12px;font-weight:600;
    letter-spacing:1px;cursor:pointer;transition:all .2s}
  .navbar .navrec:hover{border-color:var(--pine2);color:var(--pine2)}
  .navbar .navrec .rn{font-size:10px;background:var(--pine2);color:#fff;border-radius:99px;
    min-width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;padding:0 4px}
  .reclist{padding:14px 16px 26px}
  .reclist .recempty{text-align:center;color:#9aa096;padding:80px 30px;font-size:14px;line-height:2}
  .reclist .recempty .big{font-size:40px;display:block;margin-bottom:14px;opacity:.5}
  .reccard{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);
    border-radius:16px;padding:11px;margin-bottom:12px;cursor:pointer;transition:all .2s}
  .reccard:active{transform:scale(.985);border-color:var(--pine2)}
  .reccard .rcimg{width:62px;height:62px;border-radius:12px;object-fit:cover;flex:0 0 62px;background:#f3f1ea}
  .reccard .rcinfo{flex:1;min-width:0}
  .reccard .rcname{font-weight:700;font-size:15px;color:var(--ink)}
  .reccard .rcsub{font-size:12px;color:#8c9288;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .reccard .rcdate{font-size:11px;color:#b3b8af;margin-top:3px}
  .reccard .rcprice{font-weight:700;color:var(--pine2);font-size:14px;margin-right:4px}
  .recguess{margin:0 16px 12px;padding:14px 16px;border-radius:16px;background:#f4f7f0;border:1px solid #dce6d2}
  .recguess h4{margin:0 0 10px;font-size:13px;color:var(--pine2);letter-spacing:1px}
  .recguess .gitem{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px dashed #d4deca;cursor:pointer}
  .recguess .gitem:first-of-type{border-top:0}
  .recguess .gitem img{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:0 0 44px}
  .recguess .gitem .gn{font-size:14px;font-weight:600}
  .recguess .gitem .gs{font-size:12px;color:#8c9288;margin-top:2px}

  .pages{position:absolute;top:94px;left:0;right:0;bottom:0;overflow:hidden}
  .page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
    opacity:0;pointer-events:none;transform:translateX(16px);
    transition:opacity .26s ease,transform .26s ease;background:var(--paper)}
  .page.show{opacity:1;pointer-events:auto;transform:translateX(0)}
  .page::-webkit-scrollbar{display:none}

  /* 饮品舞台：满铺渐隐 + 上升气泡 */
  .stage{position:relative;width:100%;height:432px;overflow:visible;--travel:420px}
  .stage img{width:100%;height:100%;object-fit:cover;display:block;
    -webkit-mask-image:linear-gradient(to bottom,#000 56%,rgba(0,0,0,.7) 72%,transparent 97%);
            mask-image:linear-gradient(to bottom,#000 56%,rgba(0,0,0,.7) 72%,transparent 97%)}
  .bubbles{position:absolute;left:0;right:0;top:0;height:100%;overflow:hidden;pointer-events:none;z-index:3}
  .bubbles i{position:absolute;bottom:-8px;border-radius:50%;
    background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.95),rgba(255,255,255,.18));
    border:.6px solid rgba(255,255,255,.65);animation:rise linear infinite}
  @keyframes rise{
    0%{transform:translateY(0) scale(.55);opacity:0}
    12%{opacity:.95}
    88%{opacity:.7}
    100%{transform:translateY(calc(var(--travel)*-1)) scale(1.05);opacity:0}}
  .haze{position:absolute;left:-8%;right:-8%;bottom:-46px;height:150px;pointer-events:none;z-index:2;
    background:
      radial-gradient(42% 70% at 30% 60%,rgba(245,242,234,.92),transparent 70%),
      radial-gradient(46% 78% at 64% 66%,rgba(241,239,232,.85),transparent 72%),
      radial-gradient(34% 60% at 82% 52%,rgba(245,242,234,.7),transparent 72%);
    filter:blur(9px);animation:drift 9s ease-in-out infinite alternate}
  .haze.soft{opacity:.85}
  @keyframes drift{from{transform:translateX(-7px)}to{transform:translateX(9px)}}
  .topglow{position:absolute;top:-6px;left:0;right:0;height:90px;pointer-events:none;z-index:4;
    background:linear-gradient(to bottom,rgba(245,242,234,.9),transparent)}

  .titleblock{position:relative;text-align:center;margin:-34px 24px 0;z-index:5}
  .titleblock .en{font-size:10.5px;letter-spacing:5px;color:var(--gold);font-weight:600}
  .titleblock .n{font-size:33px;font-weight:700;letter-spacing:3px;color:var(--ink);margin-top:8px;
    font-family:"Songti SC",serif}
  .titleblock .hairline{width:40px;height:1px;background:var(--gold);margin:14px auto 0}

  .prose{padding:26px 30px 6px;position:relative;z-index:2}
  .prose .lab{font-size:11.5px;letter-spacing:4px;color:var(--pine);font-weight:700;
    display:flex;align-items:center;gap:10px;margin-bottom:13px}
  .prose .lab::before{content:"";width:20px;height:1px;background:var(--gold)}
  .prose .lab::after{content:"";flex:1;height:1px;background:linear-gradient(to right,var(--line),transparent)}
  .prose p{font-size:14.5px;line-height:2.05;color:#54564e;margin:0}
  .dateline{font-size:11px;letter-spacing:2px;color:var(--ink3);padding:4px 30px 0}

  .priceplain{display:flex;align-items:baseline;gap:9px;padding:22px 30px 4px}
  .priceplain b{font-size:31px;font-weight:800;color:var(--ink)}
  .priceplain span{font-size:11px;letter-spacing:1.5px;color:var(--ink2)}

  .cta{margin:20px 28px 30px;height:55px;border-radius:99px;border:0;cursor:pointer;
    background:var(--pine);color:#eef1ec;font-size:15px;font-weight:600;
    letter-spacing:6px;box-shadow:0 18px 32px -18px rgba(45,60,50,.7);width:calc(100% - 56px);
    transition:transform .18s,background .18s}
  .cta:hover{background:var(--pine2)}
  .cta:active{transform:scale(.975)}

  /* 首页：选项用轻盈卡片，层次清晰但不厚重 */
  .home-hero{padding:36px 28px 6px;text-align:center;position:relative}
  .home-hero .kicker{font-size:10.5px;letter-spacing:7px;color:var(--gold);font-weight:600}
  .home-hero h1{font-size:30px;line-height:1.5;margin:20px 0 0;color:var(--ink);font-weight:700;
    font-family:"Songti SC",serif;letter-spacing:1px}
  .home-hero h1 .em{color:var(--pine)}
  .home-hero .sub{font-size:11px;color:var(--ink3);letter-spacing:5px;margin-top:16px}
  .home-hero .rule{width:46px;height:1px;background:var(--gold);margin:18px auto 0}

  .home-menu{padding:22px 22px 10px;display:flex;flex-direction:column;gap:13px}
  .hopt{display:flex;align-items:center;gap:16px;padding:17px 18px;cursor:pointer;
    background:var(--ivory);border:1px solid var(--line);border-radius:20px;
    box-shadow:0 10px 24px -20px rgba(60,70,60,.5);
    transition:transform .26s cubic-bezier(.2,.8,.2,1),box-shadow .26s,border-color .26s}
  .hopt:hover{transform:scale(1.035);border-color:var(--gold);
    box-shadow:0 20px 34px -22px rgba(90,110,90,.6)}
  .hopt:active{transform:scale(1.01)}
  .hopt .badge{width:52px;height:52px;border-radius:15px;flex:0 0 52px;display:flex;
    align-items:center;justify-content:center;background:var(--pineSoft);
    box-shadow:inset 0 0 0 1px #d2d9d1}
  .hopt .txt b{font-size:18px;font-weight:700;letter-spacing:2px;display:block;font-family:"Songti SC",serif}
  .hopt .txt span{font-size:12px;color:var(--ink2);letter-spacing:.5px}
  .hopt .go{margin-left:auto;color:#c2c0b4;font-size:20px;transition:transform .25s,color .25s}
  .hopt:hover .go{transform:translateX(4px);color:var(--pine)}
  .home-foot{text-align:center;color:#aaaca2;font-size:10.5px;letter-spacing:5px;padding:12px 0 6px}

  /* 聊天 */
  .chatwrap{display:flex;flex-direction:column;height:100%;background:var(--paper)}
  .chatlist{flex:1;overflow-y:auto;padding:20px 16px 8px}
  .chatlist::-webkit-scrollbar{display:none}
  .cmsg{display:flex;margin-bottom:15px}
  .cmsg.user{justify-content:flex-end}
  .cb{max-width:82%;padding:13px 16px;border-radius:19px;font-size:14.5px;line-height:1.7}
  .cmsg.ai .cb{background:#fbfaf6;border:1px solid var(--line);border-top-left-radius:6px;
    color:#3f413b;box-shadow:0 8px 22px -18px rgba(50,60,50,.5)}
  .cmsg.user .cb{background:var(--pine);color:#eef1ec;border-top-right-radius:6px}
  .cai-av{width:34px;height:34px;border-radius:12px;background:var(--pineSoft);
    display:flex;align-items:center;justify-content:center;margin-right:9px;flex:0 0 34px;
    box-shadow:inset 0 0 0 1px #d2d9d1}

  .aiprev{margin-top:13px;border-radius:18px;overflow:hidden;background:#fbfaf6;
    box-shadow:0 16px 32px -24px rgba(50,60,50,.6)}
  .aiprev .pv-img{position:relative;height:210px;--travel:200px}
  .aiprev .pv-img img{width:100%;height:calc(100% + 34px);object-fit:cover;display:block;transition:opacity .5;transform:translateY(-17px)}
  .aiprev .pv-img{overflow:hidden}
  .genload{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:11px;background:#f1efe8;color:#7a8278;font-size:12.5px;letter-spacing:1px}
  .aiprev .ab{padding:13px 15px 15px}
  .aiprev .ab b{font-size:17px;letter-spacing:1.5px;font-family:"Songti SC",serif}
  .aiprev .ab .desc{display:block;font-size:12px;color:var(--ink2);margin-top:6px;line-height:1.7}
  .aiprev .ab .alead{display:block;font-size:12.5px;color:var(--tea,#8a6a3b);margin-top:8px;line-height:1.7;font-style:italic}
  .aiprev .ab .ablk{margin-top:11px;padding-top:10px;border-top:1px dashed #e7e0d2}
  .aiprev .ab .atag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:1px;color:#fff;background:linear-gradient(135deg,#b08d57,#8a6a3b);padding:2px 9px;border-radius:99px;margin-bottom:6px}
  .aiprev .ab .atxt{margin:0;font-size:12px;color:var(--ink2);line-height:1.75}
  .aiprev .ab .alayers{list-style:none;margin:0;padding:0}
  .aiprev .ab .alayers li{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--ink2);line-height:1.7;margin-top:4px}
  .aiprev .ab .alayers li i{flex:0 0 18px;height:18px;border-radius:50%;background:#f0e8d8;color:#8a6a3b;font-style:normal;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px}
  .aiprev .abtns{display:flex;gap:10px;margin-top:14px}
  .aiprev .abtns button{flex:1;height:44px;border-radius:99px;font-size:14px;font-weight:600;cursor:pointer;
    letter-spacing:3px;transition:transform .15s}
  .aiprev .abtns button:active{transform:scale(.95)}
  .bstart{border:0;background:var(--pine);color:#eef1ec}
  .breject{border:1.5px solid var(--line);background:transparent;color:var(--ink2)}

  .chips{display:flex;gap:8px;overflow-x:auto;padding:8px 14px}
  .chips button{flex:0 0 auto;border:1px solid var(--line);background:#fbfaf6;border-radius:99px;
    padding:8px 15px;font-size:12.5px;color:#5f6b5d;cursor:pointer;white-space:nowrap;transition:.2s}
  .chips button:hover{border-color:var(--pine2);color:var(--pine)}
  .chatinput{display:flex;gap:9px;padding:10px 14px 18px;background:var(--paper)}
  .chatinput input{flex:1;border:1px solid var(--line);background:#fbfaf6;border-radius:99px;
    padding:12px 18px;font-size:14.5px;outline:none}
  .chatinput input:focus{border-color:var(--pine2)}
  .chatinput button{border:0;width:47px;height:47px;border-radius:50%;cursor:pointer;font-size:18px;flex:0 0 47px;
    background:var(--pine);color:#eef1ec}
  .typing{display:inline-flex;gap:4px;padding:3px}
  .typing i{width:7px;height:7px;border-radius:50%;background:#b3bcb0;animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}

  /* 调配 */
  .conf{padding:0 0 26px}
  .cgroup{padding:24px 30px 4px;position:relative}
  .cgroup + .cgroup::before{content:"";position:absolute;top:0;left:48px;right:48px;height:1px;
    background:linear-gradient(to right,transparent,var(--line) 30%,var(--line) 70%,transparent)}
  .cgroup .clab{font-size:12px;letter-spacing:4px;color:var(--pine);font-weight:700;margin-bottom:16px}
  .cgroup .multi{font-weight:400;color:var(--ink2);letter-spacing:1px;font-size:11px}
  .addp{font-style:normal;color:var(--pine2);font-size:12px;margin-left:2px}
  .seg{display:flex;gap:6px;background:#edebe4;border:1px solid var(--line);border-radius:16px;padding:5px}
  .seg.seg4{gap:3px}
  .seg button{flex:1;padding:9px 2px;border:0;background:transparent;border-radius:12px;font-size:12.5px;
    color:var(--ink2);cursor:pointer;transition:.2s;display:flex;flex-direction:column;align-items:center;gap:3px}
  .seg button .sic{display:flex;height:16px;align-items:center}
  .seg button.on{background:#fff;color:var(--pine);font-weight:700;box-shadow:0 6px 15px -9px rgba(50,60,50,.6)}
  .switchrow{display:flex;align-items:center;justify-content:space-between;padding:9px 0}
  .switchrow .lb{font-size:14.5px;color:#40423c}
  .switch{width:50px;height:29px;border-radius:99px;background:#d6d4ca;position:relative;cursor:pointer;transition:.22s}
  .switch i{position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;
    box-shadow:0 2px 6px rgba(0,0,0,.18);transition:.22s}
  .switch.on{background:var(--pine)}
  .switch.on i{left:24px}

  .summary{margin:26px 30px 0}
  .summary .srow{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:9px 0;color:#686a62}
  .summary .srow span:last-child{color:#40423c;font-weight:600;font-style:normal}
  .summary i{font-style:normal;font-size:12px;font-weight:600}
  .summary .plus{color:#b07a3a}
  .summary .minus{color:#4f8060}
  .summary .zero{color:#a9aba2;font-weight:400}
  .summary .basep{color:#40423c;font-weight:700}
  .summary .stotal{display:flex;justify-content:space-between;align-items:center;
    border-top:1px solid var(--line);margin-top:8px;padding-top:18px}
  .summary .stotal span{font-size:12px;letter-spacing:3px;color:var(--ink2)}
  .summary .stotal b{font-size:29px;color:var(--pine);font-weight:800}

  /* 付款 */
  .pay{padding:10px 30px 28px;text-align:center}
  .pay .payamt{font-size:40px;font-weight:800;margin:14px 0 4px;color:var(--ink)}
  .pay .paytip{font-size:11.5px;color:var(--ink2);letter-spacing:3px}
  .paymethods{display:flex;gap:12px;margin:24px 0 0}
  .pmethod{flex:1;display:flex;align-items:center;gap:8px;background:var(--ivory);
    border:1.5px solid var(--line);border-radius:16px;padding:12px 10px;cursor:pointer;transition:.2s}
  .pmethod.on{border-color:var(--pine);background:#fff;box-shadow:0 10px 22px -18px rgba(50,60,50,.7)}
  .pmethod .pmi{display:flex}
  .pmethod .pmn{font-size:13px;font-weight:600;color:#3f413b}
  .pmethod .pcheck{margin-left:auto;width:19px;height:19px;border-radius:50%;background:#d6d4ca;
    color:transparent;font-size:12px;display:flex;align-items:center;justify-content:center}
  .pmethod.on .pcheck{background:var(--pine);color:#fff}
  .pay .qr-card{position:relative;margin:28px auto 0;background:#fff;border:1px solid var(--line);
    border-radius:22px;padding:20px;width:256px;box-shadow:0 24px 46px -28px rgba(50,60,50,.6)}
  .pay .qr-card img{width:214px;height:214px;display:block;margin:0 auto;border-radius:12px}
  .pay .qrbrand{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:14px;
    font-size:13.5px;font-weight:700;font-family:"Songti SC",serif}
  .pay .qrnote{font-size:10.5px;color:var(--ink3);margin-top:7px;letter-spacing:.5px}
  .payscan{margin-top:24px;height:54px;border-radius:99px;border:0;width:100%;cursor:pointer;
    background:var(--pine);color:#eef1ec;font-size:15px;font-weight:600;letter-spacing:5px;
    transition:transform .15s,background .15s}
  .payscan:active{transform:scale(.97)}
  .payscan.done{background:#5f8a6c}

  /* ===== 新付款页 ===== */
  .pay2{padding:38px 30px 30px;min-height:100%;display:flex;flex-direction:column}
  .payamt2{text-align:center;font-size:52px;font-weight:800;color:#23271f;letter-spacing:1px}
  .paycap2{text-align:center;font-size:11.5px;color:#9a9d93;letter-spacing:3px;margin-top:6px}
  .paymethods2{display:flex;gap:12px;margin:30px 0 0}
  .pm2{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;background:#fbfaf6;
    border:1.5px solid var(--line);border-radius:15px;padding:13px 8px;font-size:13.5px;font-weight:600;
    color:#4a4d45;cursor:pointer;transition:.2s}
  .pm2.on{border-color:#43584a;background:#fff;box-shadow:0 10px 22px -18px rgba(50,60,50,.7);color:#23271f}
  .payprimary{margin-top:30px;height:60px;border:0;border-radius:99px;cursor:pointer;
    background:linear-gradient(120deg,#43584a,#324438);color:#f1f4ef;font-size:17px;font-weight:700;
    letter-spacing:2px;box-shadow:0 22px 38px -20px rgba(45,60,50,.75);transition:transform .15s,filter .2s}
  .payprimary:active{transform:scale(.98)}
  .payprimarysub{text-align:center;font-size:11px;color:#9a9d93;margin-top:12px;letter-spacing:.5px}

  /* 固定金额支付提示 */
  .qrlock{margin:14px 18px 0;font-size:11px;color:#7c8477;background:#eef1ea;border:1px solid #dde5dc;
    border-radius:12px;padding:9px 12px;line-height:1.6;letter-spacing:.3px}
  .qrhint{margin:13px 24px 0;font-size:11px;color:#8a9285;text-align:center;letter-spacing:.3px}

  mem:null,
  load:function(){
    if(this.mem)return this.mem;

/* 中文风味信号 → 英文，只取前2个，避免冲淡关键约束 */
var FLAVOR_EN=[
  [/清爽|清新|清冽|解腻|通透|解渴|清凉|凉/,"clean crisp refreshing taste"],
  [/浓郁|醇厚|丝滑|绵密|奶香|厚乳|顺滑/,"rich silky creamy mouthfeel"],
  [/橙|橘|桔|鲜橙|香橙/,"bright vivid orange aroma"],
  [/茶|乌龙|茉莉|红茶|绿茶|回甘|茶香/,"clear tea fragrance with sweet aftertaste"],
  [/酸|酸甜|维\s*c|vc|c100|水溶|柠檬/,"fresh light fruity acidity"],
  [/甜|甘|蜜|微甜/,"gentle natural sweetness"],
  [/温柔|治愈|放松|舒缓/,"gentle soothing flavor"],
  [/高级|豪华|顶级|精致|优雅|贵|奢/,"refined premium flavor"],
  [/元气|开心|活力|醒神|提神|醒/,"bright energizing flavor"],
  [/热|烫|温/,"warm comforting flavor"]
];
function flavorEnNote(){
  var raw=Array.prototype.slice.call(arguments).filter(Boolean).join(" "),out=[];
  for(var i=0;i<FLAVOR_EN.length;i++){if(FLAVOR_EN[i][0].test(raw)&&out.indexOf(FLAVOR_EN[i][1])<0)out.push(FLAVOR_EN[i][1]);}
  if(!out.length)out.push("fresh balanced flavor");
  return "Express this flavor through color and texture only: "+out.slice(0,2).join(", ")+".";
}

/* ==================================================================

   覆盖所有需要说话的地方：意图/需求判断、饮品起名、高情商产品介绍、

var TEXTAI={
  /* 默认指向自建「文本AI后端」(Kimi K3)。地址优先级：localStorage(dm_text_srv) > 与页面同主机的:8787。
     后端不可达时 understand() 自动回退本地规则，保证原型离线也能点（理解质量以后端为准）。 */
  backend:(function(){
    var saved=(localStorage.getItem("dm_text_srv")||"").replace(/\/+$/,"");
    if(saved)return saved;
    try{
      if(location.protocol==="http:"||location.protocol==="https:"){
        if(location.port==="8787")return location.origin;
        return location.protocol+"//"+location.hostname+":8787";
      }
    }catch(e){}
    return "http://localhost:8787";
  })(),
  get endpoint(){return this.backend+"/api/text";},
  model:"kimi-k3",
  timeout:15000,
  useSrv:function(url){this.backend=(url||"").replace(/\/+$/,"");
    if(this.backend)localStorage.setItem("dm_text_srv",this.backend);
    return "文本后端："+(this.backend||"未配置");},
  /* 业务背景，注入到每次对话，让 AI 的判断和文案贴合这台机器 */
  MENU_CTX:"这是一台高端AI现调茶饮机。机器里只有4种原料：①东方树叶(可换乌龙/茉莉/红/绿茶底) ②水溶C100柠檬味 ③100%橙汁 ④纯牛奶，外加冰/水。"+
    "没有青柠、柠檬片、薄荷、气泡/苏打/汽水、珍珠、椰果、燕麦奶、椰奶、糖、蜂蜜、咖啡、花朵等任何其它东西；也没有气泡技术，顾客要气泡要致歉并改推一杯不带气泡同样清爽的冰饮。"+
    "可调奶量(无/少/正常/多)、温度(冰/常温/热)。所有形容词都只修饰这杯饮料本身，绝不描写或生成任何人物。招牌约¥14-17，AI定制¥18起。"+
    "支付为顾客扫店主本人微信收款码转账、备注6位订单码，店主在账本导入微信账单核对后出餐；密码指纹都在微信内完成，本机不接触。",
  FORBID:["青柠","柠檬片","薄荷","香草","迷迭香","百里香","气泡","苏打","汽水","珍珠","椰果","燕麦","椰奶",
    "蜂蜜","奶油","奶盖","咖啡","美式","拿铁","玫瑰","樱花","花朵","花瓣","鲜花",
    "女生","女孩","少女","女人","美女","男生","男孩","男人","人物","人像","模特"],
  sanitize:function(s){var t=String(s==null?"":s);for(var i=0;i<this.FORBID.length;i++)t=t.split(this.FORBID[i]).join("");
    return t.replace(/[「」『』"]/g,"").replace(/\s+/g," ").trim();},
  configured:function(){return /^https?:\/\//i.test(this.endpoint);},
  /* 指向自建「文本AI后端(Kimi K3)」：TEXTAI.useSrv("https://域名")，地址存 dm_text_srv */
  useBackend:function(url,model){if(url){this.backend=url.replace(/\/+$/,"");this.endpoint=this.backend+"/api/text";localStorage.setItem("dm_text_srv",this.backend);}if(model)this.model=model;return window.__TEXTAI_STATUS__();},
  /* 自建后端：POST /api/text {text} → 已校验好的成品 JSON（推荐，Kimi K3 在服务端） */
  callSrv:function(userText){
    return new Promise(function(resolve){
      if(!TEXTAI.backend){resolve(null);return;}
      var controller=null,timer=null,done=false;
      function finish(v){if(done)return;done=true;if(timer)clearTimeout(timer);resolve(v);}
      try{
        if(window.AbortController)controller=new AbortController();
        timer=setTimeout(function(){if(controller)try{controller.abort();}catch(e){}finish(null);},TEXTAI.timeout);
        fetch(TEXTAI.backend+"/api/text",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({text:userText}),signal:controller?controller.signal:undefined})
          .then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(j){
            if(j&&typeof j.order==="boolean")finish(j);else finish(null);
          }).catch(function(){finish(null);});
      }catch(e){finish(null);}
    });
  },
  /* 兜底底层：OpenAI 兼容 chat（未配自建后端时用），resolve 纯文本 */
  chat:function(messages){
    return new Promise(function(resolve){
      if(TEXTAI.backend||!TEXTAI.configured()){resolve(null);return;}
      var controller=null,timer=null,done=false;
      function finish(v){if(done)return;done=true;if(timer)clearTimeout(timer);resolve(v);}
      try{
        if(window.AbortController)controller=new AbortController();
        timer=setTimeout(function(){if(controller)try{controller.abort();}catch(e){}finish(null);},TEXTAI.timeout);
        fetch(TEXTAI.endpoint,{
          method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({model:TEXTAI.model,messages:messages,temperature:.9}),
          signal:controller?controller.signal:undefined
        }).then(function(r){if(!r.ok)throw 0;return r.json();})
          .then(function(j){
            var txt=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
            finish(txt?String(txt).trim():null);
          }).catch(function(){finish(null);});
      }catch(e){finish(null);}
    });
  },
  _parseJSON:function(txt){

  /* 统一把成品规整成 {order,name,desc,reply,apology,mods,ai}；任何文案再过一遍禁用词 */
  _shape:function(o,userText){

  /* 高情商 + 高智商：先问自建 Kimi 后端；不可用再退回免密钥公共模型；都失败返回 null（调用方本地兜底） */
  understand:function(userText){

      var sys="你是这台AI现调茶饮机的对话大脑。"+TEXTAI.MENU_CTX+

        "解析字段：milk奶量0-3；temp温度cold/normal/hot；tier档位1-3。只输出JSON："+
        "{\"order\":true,\"apology\":\"\",\"reply\":\"\",\"name\":\"4-6字饮品名\",\"desc\":\"30-60字风味情绪介绍\","+
        "\"milk\":null,\"temp\":null,\"tier\":null}";
      return self.chat([{role:"system",content:sys},{role:"user",content:userText}]).then(function(txt){
        var o=self._parseJSON(txt);
        if(!o||typeof o.order!=="boolean")return null;
        return self._shape(o,userText);
      }).catch(function(){return null;});

  },
  _lvl:function(v){var n=parseInt(v,10);return (n===0||n===1||n===2||n===3)?n:null;},
  _normMods:function(o){

    var milk=this._lvl(o.milk),sugar=this._lvl(o.sugar),tier=this._lvl(o.tier),orange=this._lvl(o.orange);

  /* 每日推荐 / 招牌介绍：优先自建后端 /api/daily，其次公共模型；文案过禁用词，失败 null */
  pitch:function(name,en,price,hint){

          .then(function(r){return r.ok?r.json():null;}).then(function(j){

/* ===== 历史记录：localStorage 存所有调配过的饮品，支持记录页一键再来 & 对话里召回 ===== */
var HISTORY={
  KEY:"dm_history_v1",MAX:60,
  all:function(){try{return JSON.parse(localStorage.getItem(this.KEY)||"[]");}catch(e){return [];}},
  save:function(r){
    var list=this.all();
    r.id=r.id||("h"+Date.now()+"_"+Math.floor(Math.random()*999));
    r.ts=Date.now();
    list.unshift(r);
    if(list.length>this.MAX)list=list.slice(0,this.MAX);
    try{localStorage.setItem(this.KEY,JSON.stringify(list));}catch(e){}
    if(typeof refreshRecBadge==="function")refreshRecBadge();
    return r;
  },
  count:function(){return this.all().length;},
  get:function(id){return this.all().filter(function(x){return x.id===id;})[0]||null;},
  remove:function(id){
    var list=this.all().filter(function(x){return x.id!==id;});
    localStorage.setItem(this.KEY,JSON.stringify(list));
    if(typeof refreshRecBadge==="function")refreshRecBadge();
  },
  /* 相似度：名字（含错别字容忍）+ 成分描述（奶茶/橙/清茶/维C） */
  _nameHit:function(rec,q){
    var n=(rec.name||"").replace(/[「」『』\s·]/g,""),qq=q.replace(/[「」『』\s，。、！？？!?,，.的了吗呢啊我要想来杯一杯那个这个]/g,"");
    if(!qq)return 0;
    if(n.indexOf(qq)>=0||qq.indexOf(n)>=0)return 1;
    /* 逐字命中率，容忍一两个错别字（如 清欢粒→清欢里） */
    var hit=0;for(var i=0;i<qq.length;i++)if(n.indexOf(qq[i])>=0)hit++;
    var rate=hit/Math.max(qq.length,n.length);
    return rate>=0.5?rate:0;
  },
  _ingHit:function(rec,q){
    var ing=rec.ingredients||{},score=0,need=0;
    var tests=[
      [/奶|拿铁|牛乳/,!!ing.milk],
      [/橙|橘|果汁/,!!ing.orange],
      [/维\s*c|c100|水溶|果味|酸/,!!ing.c],
      [/清茶|绿茶|乌龙|茉莉|红茶|纯茶/,ing.tea&&!ing.milk&&!ing.orange&&!ing.c]
    ];
    for(var i=0;i<tests.length;i++){
      if(tests[i][0].test(q)){need++;if(tests[i][1])score++;}
    }
    return need?score/need:0;
  },
  /* 在用户一句话里找历史：返回 {rec, candidates:[...], kind} */
  detect:function(q){
    var t=(q||"").toLowerCase(),list=this.all();
    if(!list.length)return null;
    /* 时间指代：直接取最近 */
    if(/上次|上回|前次|刚才|之前|最近|昨天|今天|那杯|那个|再来一?杯|还喝|照旧|老样子|一样的/.test(t)){
      /* "上次+名字" 先按名字筛 */
      var byName=this.matchByName(t.replace(/上次|上回|前次|刚才|之前|最近|昨天|今天|那杯|那个|再来一?杯|还喝|照旧|老样子|一样的|的|喝/g," ").trim());
      var pool=byName.length?byName:list;
      return {rec:pool[0],candidates:[],kind:"recent"};
    }
    /* 点名：精确/模糊名字（但"奶茶/橙汁/清茶"这类通用口味词不算点名，走成分匹配） */
    var bare=t.split("").filter(function(ch){
      return "，。、！？？!?,，.「」『』 　的了吗呢啊我要想来杯一个那这给做调喝点甜冰热浓清淡好最上次回前才之近昨天再来还照旧老样子".indexOf(ch)<0;
    }).join("");
    var isGeneric=/^(奶茶|牛奶|奶|清茶|红茶|绿茶|乌龙茶|茉莉|橙汁|橙子|果茶|果汁|水果茶|维C|维c|c100|气泡水|可乐|茶|饮品|饮料|好喝的|招牌|最贵|便宜)$/;
    var mn=isGeneric.test(bare)?[]:this.matchByName(t);
    if(mn.length){
      if(mn.length===1)return {rec:mn[0],candidates:[],kind:"name"};
      return {rec:mn[0],candidates:mn.slice(0,3),kind:"guess"};
    }
    /* 成分描述 */
    var scored=list.map(function(rec){return {rec:rec,s:HISTORY._ingHit(rec,t)};}).filter(function(x){return x.s>=0.66;}).sort(function(a,b){return b.s-a.s;});
    if(scored.length===1)return {rec:scored[0].rec,candidates:[],kind:"ingredient"};
    if(scored.length>1){
      var top=scored[0].s,ties=scored.filter(function(x){return x.s===top;}).map(function(x){return x.rec;});
      return {rec:ties[0],candidates:ties.slice(0,3),kind:"guess"};
    }
    return null;
  },
  matchByName:function(t){
    var self=this;
    return self.all().map(function(rec){return {rec:rec,s:self._nameHit(rec,t)};})
      .filter(function(x){return x.s>0;}).sort(function(a,b){return b.s-a.s;}).map(function(x){return x.rec;});
  }
};

/* ===== 意图判断（本地兜底）：默认就按顾客说的生成，只拦纯打招呼/道谢/故障/问价表 =====
   设计原则：不挑顾客措辞，只要带一点对饮品的需求/形容/心情/价格/原料倾向就出单。 */
function detectIntent(t){
  /* 仅这些“纯社交 / 纯系统”场景才不出单 */
  if(/^(你好|您好|嗨|哈喽|hello|hi|在吗|在不在|喂)[\s!！.。~]*$/i.test(t))return {order:false,reply:chatReply(t)};
  if(/^(谢谢|谢啦|感谢|多谢|thanks|thank you)[\s!！.。~]*$/i.test(t))return {order:false,reply:chatReply(t)};
  if(/^(哈哈+|呵呵+|233+|666+)[\s!！.。~]*$/.test(t))return {order:false,reply:chatReply(t)};
  if(/坏了|故障|不能用|不出饮料|不出杯|卡住了|维修/.test(t))return {order:false,reply:chatReply(t)};
  /* 纯辱骂/抬杠，且全句没有任何对饮品的需求或形容 → 高情商化解，不出单 */
  var insult=/傻|蠢|笨|有病|神经病|智障|白痴|垃圾|废物|滚|脑残|有病吧|脑子/.test(t);
  var anyDrinkCue=/喝|奶茶|咖啡|茶|奶|糖|冰|热|气泡|甜|清爽|浓郁|解渴|提神|口味|口感|来|要|给|整|搞|安排|推荐|渴|杯|贵|便宜|好喝|心情|困|累|丧|烦/.test(t);
  if(insult && !anyDrinkCue)return {order:false,reply:chatReply(t)};
  /* 明确询问“价格表/多少钱”，且全程没有任何对饮品的形容或点单意思，才只报价 */
  if(/多少钱|价格表|怎么收费|价位表|菜单价/.test(t) && !/要|来|给我|整|搞|安排|推荐|最贵|最好|便宜|好喝|口感|口味|心情|奶|茶|咖啡|甜|冰|热|气泡/.test(t))
    return {order:false,reply:chatReply(t)};
  /* 其余一律按点单处理：哪怕只有“最贵的不要奶”“随便”“整点好喝的” */
  return {order:true};
}
/* 本地解析顾客的具体需求（断网兜底用）；返回与模型 mods 同构的对象 */
function parseMods(t){
  var m={};
  /* 档位：最贵 / 顶级 → 3；便宜 / 划算 → 1 */
  if(/最贵|顶级|最好|豪华|顶配|高端|不差钱|来个贵|要好的|贵一点/.test(t))m.tier=3;
  else if(/最便宜|便宜点|便宜的|划算|实惠|平价|省钱/.test(t))m.tier=1;
  /* 奶量：明确不要奶 → 0；多奶/少奶 */
  if(/不要奶|不加奶|去奶|无奶|别放奶|不放奶|不要加奶|没奶/.test(t))m.milk=0;
  else if(/多奶|奶多|加多点奶|双倍奶/.test(t))m.milk=3;
  else if(/少奶|奶少|少放点奶/.test(t))m.milk=1;
  /* 机器只有纯牛奶，不提供燕麦/椰/豆奶（识别到也不外放其它奶种，统一纯牛奶） */
  /* 糖 */
  if(/无糖|不要糖|不加糖|去糖|零卡/.test(t))m.sugar=0;
  else if(/少糖|低糖|微糖|三分|不.*甜|别太甜/.test(t))m.sugar=1;
  else if(/多糖|甜一点|多加糖|全糖/.test(t))m.sugar=3;
  /* 温度 */
  if(/热饮|热的|要热|来杯热|加热|烫|暖/.test(t))m.temp="hot";
  else if(/常温|不冰|不要冰/.test(t))m.temp="normal";
  else if(/冰|冷|凉|冰镇|冰爽/.test(t))m.temp="cold";
  /* 机器没有珍珠/椰果；AI 只能调配真实存在的橙汁份量 */
  if(/不要橙|不加橙|去橙|无橙|不要.*橙汁/.test(t))m.orange=0;
  else if(/多.*橙|橙.*多|加橙/.test(t))m.orange=3;
  /* 具体预算 */
  var b=parseBudget(t);if(b!=null)m.budget=b;
  return Object.keys(m).length?m:null;
}

/* 从用户这句话里解析预算：如“要99的”“不低于50”“一百块” */
function parseBudget(t){
  var cn={一:1,二:2,两:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9,十:10};
  var m=t.match(/(\d+(?:\.\d+)?)\s*(?:块|元|rmb|￥|¥)/i);
  var val=null;
  if(m)val=parseFloat(m[1]);
  else{
    var mm=t.match(/([一二两三四五六七八九十百零]+)\s*[块元]/);
    if(mm){var s=mm[1],num=0,sec=0;
      for(var i=0;i<s.length;i++){var ch=s[i];
        if(ch==="百"){sec+=(num||1)*100;num=0;}
        else if(ch==="十"){sec+=(num||1)*10;num=0;}
        else if(ch==="零"){}
        else num=cn[ch]||0;}
      val=sec+num;}
  }
  if(val!=null && val>=1)return val;
  /* “不低于99 / 至少99 / 99以上” */
  return null;
}

function recSub(r){
  var ing=r.ingredients||{},parts=[];
  if(ing.milk)parts.push("奶茶");
  if(ing.orange)parts.push("橙汁");
  if(ing.c)parts.push("维C果茶");
  if(!parts.length)parts.push("清茶");
  parts.push(r.temp==="hot"?"热饮":(r.temp==="normal"?"常温":"冰饮"));
  if(r.ice&&r.ice!=="正常冰"&&r.ice!=="热饮无冰")parts.push(r.ice);
  if(r.sugar&&r.sugar!=="标准糖")parts.push(r.sugar);
  return parts.join(" · ");
}
function recTime(ts){
  var d=new Date(ts),now=new Date(),pad=function(n){return n<10?"0"+n:""+n;};
  var sameDay=d.toDateString()===now.toDateString();
  var yest=new Date(now);yest.setDate(now.getDate()-1);
  var isYest=d.toDateString()===yest.toDateString();
  var hm=pad(d.getHours())+":"+pad(d.getMinutes());
  if(sameDay)return "今天 "+hm;
  if(isYest)return "昨天 "+hm;
  return (d.getMonth()+1)+"月"+d.getDate()+"日 "+hm;
}

/* milk：奶量0-3；mtype：奶种 cow牛奶/oat燕麦奶/coco椰奶/soy豆奶；
   extra：每种配料份量 0不要 1少 2正常 3多 */
var cst={milk:2,mtype:"cow",sugar:2,extra:{pearl:0,coconut:0,orange:2},temp:"cold"};
var LNAME=["无","少","正常","多"];
var MILKTYPES={
  cow:{name:"牛奶",d:0,cost:.8},
  oat:{name:"燕麦奶",d:2,cost:1.6},
  coco:{name:"椰奶",d:2,cost:1.5},
  soy:{name:"豆奶",d:1,cost:1.0}
};
/* 配料：售价系数(每份 delta = 单价*份量系数) 与 单位原料成本(按正常份) */
var TOPP={
  pearl:{name:"珍珠",basePrice:2,baseCost:.7},
  coconut:{name:"椰果",basePrice:2,baseCost:.6},
  orange:{name:"新鲜橙片",basePrice:1,baseCost:.5}
};
var TOPP_Q=[0,.6,1,1.5];            // 份量对应价格系数
var TOPP_COST_Q=[0,.6,1,1.45];      // 份量对应成本系数
function deltaText(v){if(v>0)return '<i class="plus">+¥'+v+'</i>';if(v<0)return '<i class="minus">-¥'+(-v)+'</i>';return '<i class="zero">¥0</i>';}

/* ===== 成本模型（市场采购价口径的原料成本） =====
   不同饮品基础成本不同，再叠加奶/糖/配料 */
var BASECOST={d1:5.2,d2:4.6,feng:4.3,rou:5.6};
function calcPrice(){
  var s=cst;
  var base=ctx.isAI?ctx.aiPrice:drinkById(ctx.drinkId).price;
  var dMilk=(s.milk===3?2:s.milk===0?-1:0);
  var dSugar=(s.sugar===3?1:0);
  var dMtype=MILKTYPES[s.mtype].d;
  var dTop=0,dItems=[];
  Object.keys(TOPP).forEach(function(k){
    var d=Math.round(TOPP[k].basePrice*TOPP_Q[s.extra[k]]*100)/100;
    dTop=Math.round((dTop+d)*100)/100;
    if(s.extra[k]>0)dItems.push(TOPP[k].name+LNAME[s.extra[k]]);
  });
  /* 用户主动选择的加料/规格：独立计价，永远叠加，不受目标价/档位影响 */
  var addOns=Math.round((dMilk+dSugar+dMtype+dTop)*100)/100;
  /* 基础那杯：只含起价与档位；目标预算只作用于基础杯，不抵扣任何加料 */
  var tierUp=0,tierLabel="";
  if(ctx.aiTier===3){tierUp=14;tierLabel="顶级尊享";}
  else if(ctx.aiTier===1){tierUp=-4;tierLabel="高性价比";}
  var core=Math.round((base+tierUp)*100)/100;
  var premium=0;
  if(ctx.targetBudget && ctx.targetBudget>core){
    premium=Math.round((ctx.targetBudget-core)*100)/100;  /* 把“基础那杯”顶到预算，加料另算 */
  }
  var total=Math.round((core+premium+addOns)*100)/100;
  if(total<8){var adj=Math.round((8-total)*100)/100;tierUp=Math.round((tierUp+adj)*100)/100;core=Math.round((core+adj)*100)/100;total=Math.round((core+premium+addOns)*100)/100;}  /* 守地板价，但不动加料 */
  return {base:base,dMilk:dMilk,dSugar:dSugar,dMtype:dMtype,dTop:dTop,addOns:addOns,
    subtotal:Math.round((base+addOns)*100)/100,tierUp:tierUp,tierLabel:tierLabel,premium:premium,total:total,dItems:dItems};
}
function calcCost(){
  var s=cst;
  /* AI 定制单同样有茶汤/果汁基底成本（按招牌均价档计 5.0），不能为 0，
     否则会出现“卖一杯净利等于售价”的错误 */
  var base=ctx.isAI?5.0:(BASECOST[ctx.drinkId]!=null?BASECOST[ctx.drinkId]:5);
  var cMilk=(s.milk===3?.6:s.milk===1?-.2:s.milk===0?-.5:0);
  var cMtype=Math.round((MILKTYPES[s.mtype].cost-MILKTYPES.cow.cost)*100)/100;
  var cSugar=(s.sugar===3?.15:0);
  var cTop=0;
  Object.keys(TOPP).forEach(function(k){
    cTop+=TOPP[k].baseCost*TOPP_COST_Q[s.extra[k]];
  });
  var overhead=1.2;   // 杯/吸管/封口/水电分摊
  var cTier=ctx.aiTier===3?5.0:ctx.aiTier===1?-0.8:0;  /* 顶级档用优选原料，平价档省料 */
  var c=Math.round((base+cMilk+cMtype+cSugar+cTop+overhead+cTier)*100)/100;
  return Math.max(c,0);
}
function summaryHTML(){
  var s=cst,p=calcPrice();
  ctx.lastPrice=p.total;
  function row(l,v){return '<div class="srow"><span>'+l+'</span><span>'+v+'</span></div>';}
  var baseName=ctx.isAI?ctx.aiName:drinkById(ctx.drinkId).name;
  var h='<div class="summary">'+
    row("「"+baseName+"」起价",'<b class="basep">¥'+p.base+'</b>')+
    row(LNAME[s.milk]+"奶",deltaText(p.dMilk))+
    row(MILKTYPES[s.mtype].name,(p.dMtype?'<i class="plus">+¥'+p.dMtype+'</i>':'<i class="zero">¥0</i>'))+
    row(LNAME[s.sugar]+"糖",deltaText(p.dSugar))+
    row("珍珠："+LNAME[s.extra.pearl],deltaText(
      Math.round(TOPP.pearl.basePrice*TOPP_Q[s.extra.pearl]*100)/100))+
    row("椰果："+LNAME[s.extra.coconut],deltaText(
      Math.round(TOPP.coconut.basePrice*TOPP_Q[s.extra.coconut]*100)/100))+
    row("新鲜橙片："+LNAME[s.extra.orange],deltaText(
      Math.round(TOPP.orange.basePrice*TOPP_Q[s.extra.orange]*100)/100))+
    row("温度："+({cold:"冰",normal:"常温",hot:"热"})[s.temp],deltaText(0));
  if(p.tierUp!==0)h+=row(p.tierLabel==="顶级尊享"?"顶级尊享（按你要的最贵档，优选原料）":"高性价比档",deltaText(p.tierUp));
  if(p.premium>0)h+=row("定制溢价（基础那杯按预算 ¥"+ctx.targetBudget+"，加料另计）",deltaText(p.premium));
  h+='<div class="stotal"><span>合 计</span><b>¥'+p.total+'</b></div></div>';
  return h;
}

/* 收款方是店主本人微信号（个人收款码）。顾客扫码转账给店主，并填 6 位订单码；
   店主在「饮料机账本」导入微信账单 CSV 自动核对记账。个人收款码无官方到账回调，
   这里不伪造支付成功；只有店主核对到账后机器才会确认出餐。 */
var OWNER_WXID="wxid_auf9zvuxskml22";
var ORDKEY="drink_machine_orders_v1";
var QRKEY="drink_machine_owner_qr";
function maskWxid(s){return s&&s.length>10?s.slice(0,8)+"…"+s.slice(-2):s;}
function genOrderCode(){
  for(var i=0;i<50;i++){
    var c=String(Math.floor(100000+Math.random()*900000));
    var dup=loadOrders().some(function(o){return o.code===c&&o.status!=="paid";});
    if(!dup)return c;
  }
  return String(Date.now()).slice(-6);
}
function loadOrders(){try{return JSON.parse(localStorage.getItem(ORDKEY)||"[]");}catch(e){return [];}}
function saveOrders(a){try{localStorage.setItem(ORDKEY,JSON.stringify(a));}catch(e){}}
function ownerQr(){try{return localStorage.getItem(QRKEY)||"";}catch(e){return "";}}
/* 同一杯同金额、10 分钟内未核对的订单复用，避免重复进支付页生成一堆单 */
function ensureOrder(amount,itemName,cost){
  var now=Date.now(),ords=loadOrders();
  var hit=ords.filter(function(o){
    return o.status!=="paid"&&Math.abs(o.amount-amount)<0.005&&o.item===itemName&&now-o.ts<10*60*1000;
  }).sort(function(a,b){return b.ts-a.ts;})[0];
  if(hit)return hit;
  var o={orderId:"YL"+now+"_"+Math.random().toString(36).slice(2,6),
    code:genOrderCode(),amount:amount,cost:cost,item:itemName,ts:now,status:"pending"};
  ords.push(o);saveOrders(ords);return o;
}

    "欢迎光临～<br>想喝什么直接开口，模糊一点也没关系，“随便来点”“解解腻”“热乎点”，我都听得懂、做得出。",
    "嘿，准备好被一杯饮料懂一下了吗？<br>说说口味或心情，这杯的名字和味道，都会跟着你这句话长出来。",
    "你来啦～<br>好味道值得现做：你一句话，我马上给你变出一杯专属的，名字也是为这一杯新起的。",
    "嗨～今天想清爽利落，还是醇厚治愈？<br>没有标准答案，你说出来的那句最重要，我负责把它做到最好喝。",
    "欢迎呀。<br>茶香清透、奶香丝滑、果香明亮，浓淡冰热样样都有——告诉我你此刻想要的味道就好。"
  ];
  say(welcomes[Math.floor(Math.random()*welcomes.length)]);
}

/* 记录页：点一条 → 进 AI 配比并直接重做这杯 */
function bindHistory(p){
  var cards=p.querySelectorAll(".reccard");
  for(var i=0;i<cards.length;i++){(function(card){
    card.onclick=function(){
      var r=HISTORY.get(card.getAttribute("data-hid"));
      if(!r)return;
      go("ai");
      setTimeout(function(){if(window.__replayHistory)window.__replayHistory(r);},320);
    };
  })(cards[i]);}
}

/* 回到默认调配状态（AI 单开始前也用它重置） */
function resetCst(temp){
  cst={milk:2,mtype:"cow",sugar:2,extra:{pearl:0,coconut:0,orange:2},temp:temp||"cold"};
}
/* 把 AI/本地解析出的偏好落到 cst 与 ctx（价格档位/目标预算） */
function applyMods(m){
  if(!m)return;
  if(typeof m.milk==="number"&&m.milk>=0&&m.milk<=3)cst.milk=m.milk;
  if(m.mtype&&MILKTYPES[m.mtype])cst.mtype=m.mtype;
  if(typeof m.sugar==="number"&&m.sugar>=0&&m.sugar<=3)cst.sugar=m.sugar;
  if(typeof m.temp==="string"&&/cold|normal|hot/.test(m.temp))cst.temp=m.temp;
  ["pearl","coconut","orange"].forEach(function(k){
    if(typeof m[k]==="number"&&m[k]>=0&&m[k]<=3)cst.extra[k]=m[k];
  });
  if(typeof m.tier==="number"&&m.tier>=0&&m.tier<=3)ctx.aiTier=m.tier;
  if(typeof m.budget==="number"&&m.budget>0)ctx.targetBudget=m.budget;
}

/* ==================================================================
   页面导航框架：页面栈 stack + mount/go/back/chrome
   ================================================================== */
var stack=[];
var META={
  home:{t:"",bar:false,noBack:true},
  daily:{t:"每日推荐"},
  ai:{t:"AI 配比"},
  history:{t:"调 配 记 录"},
  select:{t:"饮品选择"},
  config:{t:"调 配"},
  pay:{t:"收 银 台"}
};
var pagesEl=document.getElementById("pages");
var navEl=document.getElementById("navbar");
function mount(name){
  var el=document.createElement("div");
  el.className="page";
  el.innerHTML=T[name]();
  pagesEl.appendChild(el);
  bind(name,el);
  return el;
}
function bind(name,p){
  if(name==="home")bindHome(p);
  else if(name==="daily")bindDaily(p);
  else if(name==="ai")bindChat(p);
  else if(name==="history")bindHistory(p);
  else if(name==="select")bindSelect(p);
  else if(name==="config")bindConfig(p);
  else if(name==="pay")bindPay(p);
}
function chrome(name){
  var m=META[name]||{t:""};
  if(m.bar===false){navEl.style.visibility="hidden";return;}
  navEl.style.visibility="visible";
  var backHTML=(stack.length>1&&!m.noBack)?'<span class="back" id="navBack">‹</span>':"";
  var recHTML=(name==="ai")?'<span class="navrec" id="navRec">记录<span class="rn" id="navRecN">0</span></span>':"";
  navEl.innerHTML=backHTML+'<span id="navtitle">'+(m.t||"")+'</span>'+recHTML;
  var b=navEl.querySelector("#navBack");
  if(b)b.onclick=back;   /* 绑定全局返回函数 back()；局部字符串变量已改名 backHTML，避免 var 提升遮蔽 */
  var r=navEl.querySelector("#navRec");
  if(r){refreshRecBadge();r.onclick=function(){go("history");};}
}
function go(name){
  var el=mount(name);
  stack.push({name:name,el:el});
  requestAnimationFrame(function(){el.classList.add("show");});
  chrome(name);
}
function back(){
  if(stack.length<=1)return;
  var cur=stack.pop();
  cur.el.classList.remove("show");
  setTimeout(function(){if(cur.el.parentNode)cur.el.parentNode.removeChild(cur.el);},260);
  var top=stack[stack.length-1];
  chrome(top.name);
}
/* 清空栈直接回首页（扫码进入/支付后重置用） */
function resetHome(){
  while(stack.length>1){
    var x=stack.pop();
    if(x.el.parentNode)x.el.parentNode.removeChild(x.el);
  }
  var top=stack[0];
  if(top){top.el.classList.add("show");chrome("home");}
}

/* ---------- 首页 ---------- */
function bindHome(p){
  p.querySelectorAll(".hopt[data-go], [data-go]").forEach(function(el){
    el.onclick=function(){go(el.getAttribute("data-go"));};
  });
}
/* ---------- 每日推荐 ---------- */
function bindDaily(p){
  var btn=p.querySelector('[data-go="config"]');
  if(btn)btn.onclick=function(){
    var d=drinkById(ctx.drinkId);
    resetCst();
    ctx.isAI=false;ctx.aiTier=0;ctx.targetBudget=0;
    ctx.lastPrice=d.price;
    go("config");
  };
  /* 每日推荐文案：真模型现生成（失败用默认 reason 兜底），按天缓存 */
  var pitch=p.querySelector("#dailyPitch");
  if(pitch&&window.TEXTAI){
    var d=drinkById(ctx.drinkId),cacheKey="daily_pitch_"+todayStr()+"_"+d.id;
    var cached=null;try{cached=localStorage.getItem(cacheKey);}catch(e){}
    if(cached){pitch.textContent=cached;}
    else{
      TEXTAI.pitch(d.name,d.en,d.price,d.reason).then(function(txt){
        if(txt&&pitch){pitch.textContent=txt;try{localStorage.setItem(cacheKey,txt);}catch(e){}}
      }).catch(function(){});
    }
  }
}
/* ---------- 饮品选择 ---------- */
function bindSelect(p){
  p.querySelectorAll("[data-drink]").forEach(function(el){
    el.onclick=function(){
      ctx.drinkId=el.getAttribute("data-drink");
      ctx.isAI=false;ctx.aiTier=0;ctx.targetBudget=0;
      resetCst();
      ctx.lastPrice=drinkById(ctx.drinkId).price;
      go("config");
    };
  });
}
/* ---------- 调配 ---------- */
function bindConfig(p){
  function refreshSegs(){
    p.querySelectorAll(".seg[data-g]").forEach(function(seg){
      var g=seg.getAttribute("data-g");
      seg.querySelectorAll("button").forEach(function(b){
        var v=b.getAttribute("data-v");
        var on;
        if(g==="temp")on=(cst.temp===v);
        else if(g==="mtype")on=(cst.mtype===v);
        else on=(String(cst[g])===v);
        b.classList.toggle("on",!!on);
      });
    });
    p.querySelectorAll(".seg[data-tg]").forEach(function(seg){
      var k=seg.getAttribute("data-tg");
      seg.querySelectorAll("button").forEach(function(b){
        b.classList.toggle("on",String(cst.extra[k])===b.getAttribute("data-v"));
      });
    });
  }
  p.querySelectorAll(".seg[data-g]").forEach(function(seg){
    seg.onclick=function(e){
      var b=e.target.closest("button");if(!b)return;
      var g=seg.getAttribute("data-g"),v=b.getAttribute("data-v");
      if(g==="temp")cst.temp=v;
      else if(g==="mtype")cst.mtype=v;
      else cst[g]=parseInt(v,10);
      var pr=calcPrice();ctx.lastPrice=pr.total;
      refreshSegs();refreshSum();
    };
  });
  p.querySelectorAll(".seg[data-tg]").forEach(function(seg){
    seg.onclick=function(e){
      var b=e.target.closest("button");if(!b)return;
      var k=seg.getAttribute("data-tg");
      cst.extra[k]=parseInt(b.getAttribute("data-v"),10);
      var pr=calcPrice();ctx.lastPrice=pr.total;
      refreshSegs();refreshSum();
    };
  });
  var pr=calcPrice();ctx.lastPrice=pr.total;refreshSum();
  var tp=p.querySelector("#toPay");
  if(tp)tp.onclick=function(){go("pay");};
}

stack.push({name:"home",el:mount("home")});
requestAnimationFrame(function(){stack[0].el.classList.add("show");});
chrome("home");
</script>
